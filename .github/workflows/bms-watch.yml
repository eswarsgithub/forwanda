name: BookMyShow watcher

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to save the last show count

concurrency:
  group: bms-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Check show count
        env:
          BMS_URL: ${{ secrets.BMS_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_JUMP: "5"
          ALERT_AT_OR_ABOVE: "0"
        run: python bms_watcher.py --once

      - name: Save last count
        run: |
          git config user.name "bms-bot"
          git config user.email "bms-bot@users.noreply.github.com"
          git add bms_state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
